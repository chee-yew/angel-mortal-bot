name = "angel-mortal-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Serve at https://angel-mortal-bot.chee-yew.workers.dev
# (yours will be https://<name>.<your-subdomain>.workers.dev)
workers_dev = true
# No per-version preview URLs: only the live deployment should receive webhooks.
preview_urls = false

# Every minute: deliver queued /broadcast messages in small batches
# (the free plan caps outgoing requests per invocation at 50).
[triggers]
crons = ["* * * * *"]

[vars]
# Shown at the top of the bot's help message, e.g. "👼 E Block Angel & Mortal bot".
EVENT_NAME = "E Block Angel & Mortal"

# Comma-separated Telegram user IDs allowed to use admin commands.
# Send /myid to the bot to find yours, and replace this one.
ADMIN_IDS = "959835900"

[[d1_databases]]
binding = "DB"
database_name = "angel-mortal"
# Replace with the id printed by `npx wrangler d1 create angel-mortal`.
database_id = "f622c6d8-cc6e-40be-a8e9-0bd5f37e8834"
